name: Build Michi site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: michi-build
  cancel-in-progress: true

jobs:
  build-and-sync:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[site-sync]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm run build

      - name: Sync production bundle into branch root
        run: |
          rm -rf assets
          cp -R dist/assets ./assets
          cp dist/app.html ./index.html
          cp dist/manifest.webmanifest ./manifest.webmanifest
          cp dist/icon.svg ./icon.svg
          cp dist/sw.js ./sw.js
          touch .nojekyll

      - name: Commit production bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets manifest.webmanifest icon.svg sw.js .nojekyll
          if git diff --cached --quiet; then
            echo "Production bundle is already current"
            exit 0
          fi
          git commit -m "Обновить готовую версию Michi [site-sync]"
          git push origin HEAD:main
