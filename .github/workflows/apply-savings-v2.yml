name: Apply savings guardrail UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-savings-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch App route
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8')

          import_anchor = "import { buildAttentionCards, ensureWorkspace, loadNavigationData } from './lib/navigation'\n"
          import_line = "import { SavingsPageV2 } from './pages/SavingsPageV2'\n"
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('Import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          old_route = '<Route path="/savings" element={<SavingsPage userId={userId} />} />'
          new_route = '<Route path="/savings" element={<SavingsPageV2 userId={userId} />} />'
          if old_route in text:
              text = text.replace(old_route, new_route, 1)
          elif new_route not in text:
              raise SystemExit('Savings route anchor not found')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "Already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Подключить защитную линию сбережений"
          git push
